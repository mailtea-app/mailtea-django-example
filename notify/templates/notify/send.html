<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send an email with Mailtea</title>
    <style>
      body { font: 16px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
      label { display: block; margin-top: 1rem; }
      input, textarea { width: 100%; padding: .5rem; font: inherit; }
      button { margin-top: 1rem; padding: .5rem 1rem; font: inherit; }
      .ok, .error { margin-top: 1.5rem; padding: .75rem; }
      .ok { background: #e8f5e9; }
      .error { background: #fdecea; }
      code { word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Send an email</h1>

    {% if email_id %}
      <p class="ok">Sent. Mailtea id <code>{{ email_id }}</code></p>
    {% endif %}
    {% if error %}
      <p class="error">Could not send: {{ error }}</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Send</button>
    </form>
  </body>
</html>
